apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcam-api
  labels: { app: mcam-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: mcam-api }
  template:
    metadata:
      labels: { app: mcam-api }
    spec:
      containers:
        - name: api
          image: registry.example.com/mcam/api:5.0.0
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: mcam-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: mcam-api }
spec:
  selector: { app: mcam-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: mcam-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: mcam-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
