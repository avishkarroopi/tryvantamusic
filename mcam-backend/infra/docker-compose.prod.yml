# Full production-shaped stack for M-CAM V5. Media rides LiveKit; the API is the
# control plane; Caddy terminates TLS and reverse-proxies. Scale `api` freely —
# it is stateless (rate-limit + realtime hub move to Redis for multi-instance).
version: "3.9"
services:
  api:
    # PRODUCTION FIX (deployment cleanup): the backend was consolidated from
    # apps/api into mcam-backend/ at the repo root; this context pointed at a
    # path (mcam-backend/apps/api) that no longer exists.
    build: { context: .. }
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mcam:${DB_PASSWORD}@postgres:5432/mcam
      REDIS_URL: redis://redis:6379/0
      # PRODUCTION FIX (deployment cleanup): these three were never passed
      # through, so the container always fell back to config.py's insecure
      # defaults (JWT_SECRET) or an unreachable host (S3_ENDPOINT defaulted to
      # localhost, not this stack's `minio` service) regardless of what was
      # set outside. JWT_SECRET is also what the startup fail-fast check in
      # app/main.py inspects — see docs/DEPLOYMENT.md for required values.
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      S3_ENDPOINT: http://minio:9000
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      S3_BUCKET: ${S3_BUCKET}
    depends_on: [postgres, redis, minio]
    deploy: { replicas: 3 }
    expose: ["8000"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mcam
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mcam
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml"]
    # PRODUCTION FIX (deployment cleanup): livekit.yaml (below) intentionally
    # carries no credentials so a real API key/secret is never committed to
    # version control. LIVEKIT_KEYS is LiveKit's own supported mechanism for
    # supplying keys via environment alongside a --config file; this is the
    # same mechanism already used, unparameterized, by the dev stack
    # (docker-compose.yml, LIVEKIT_KEYS: "devkey: devsecret").
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]

  caddy:
    image: caddy:2-alpine
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data"]

volumes: { pgdata: {}, redisdata: {}, miniodata: {}, caddydata: {} }
